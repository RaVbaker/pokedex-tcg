<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pokédex TCG</title>
  <meta name="description" content="National Pokédex for sorting Pokémon TCG cards in a binder and tracking your collection.">
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pokédex TCG">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="lens" aria-hidden="true"><span></span></div>
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="brand">
        <h1>Pokédex <span>TCG</span></h1>
        <div class="progress" id="progress">
          <div class="bar"><div class="fill" id="progressFill"></div></div>
          <span id="progressText">…</span>
        </div>
      </div>
      <button class="icon-btn" id="scanBtn" data-i18n-aria="scan">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 4h5V2H2v7h2V4Zm11-2v2h5v5h2V2h-7ZM4 15H2v7h7v-2H4v-5Zm16 5h-5v2h7v-7h-2v5ZM8.5 7h7A1.5 1.5 0 0 1 17 8.5v7a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 15.5v-7A1.5 1.5 0 0 1 8.5 7Zm.5 2v6h6V9H9Z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7c-.6.3-1.2.6-1.7 1l-2.5-1-2 3.5L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.7h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
    </div>

    <div class="views" role="tablist">
      <button role="tab" id="viewDex" data-view="dex" aria-selected="true" data-i18n="viewDex">Pokédex</button>
      <button role="tab" id="viewAlbum" data-view="album" aria-selected="false" data-i18n="viewAlbum">Mój album</button>
      <button role="tab" id="viewSets" data-view="sets" aria-selected="false" data-i18n="viewSets">Zestawy</button>
    </div>

    <div class="search-row">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
        <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="clear-btn" id="qClear" hidden data-i18n-aria="clear">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm3.5 5.1L12 10.6 8.5 7.1 7.1 8.5l3.5 3.5-3.5 3.5 1.4 1.4 3.5-3.5 3.5 3.5 1.4-1.4-3.5-3.5 3.5-3.5-1.4-1.4Z"/></svg>
        </button>
      </label>
      <button class="filter-btn" id="filterBtn" aria-expanded="false" aria-controls="filters">
        <span data-i18n="filters">Filtry</span> <span class="badge" id="filterCount" hidden>0</span>
      </button>
    </div>

    <div class="filters" id="filters" hidden>
      <div class="chips" id="typeChips" role="group" data-i18n-aria="type"></div>
      <div class="filter-grid">
        <label><span data-i18n="ownership">Posiadanie</span>
          <select id="fOwned">
            <option value="" data-i18n="all">Wszystkie</option>
            <option value="owned" data-i18n="owned">Mam</option>
            <option value="missing" data-i18n="missing">Brakuje</option>
          </select>
        </label>
        <label><span data-i18n="generation">Generacja</span>
          <select id="fGen"><option value="" data-i18n="all">Wszystkie</option></select>
        </label>
        <label class="wide"><span data-i18n="setLabel">Kolekcja (zestaw kart)</span>
          <select id="fSet"><option value="" data-i18n="allSets">Wszystkie zestawy</option></select>
        </label>
        <label><span data-i18n="numLabel">Nr w kolekcji</span>
          <input id="fNum" type="text" inputmode="text" data-i18n-ph="numPh" autocomplete="off">
        </label>
        <label><span data-i18n="sort">Sortowanie</span>
          <select id="fSort">
            <option value="dex" data-i18n="sortDex">Nr Pokédex</option>
            <option value="name" data-i18n="sortName">Nazwa A–Z</option>
            <option value="type" data-i18n="sortType">Typ</option>
            <option value="set" data-i18n="sortSet">Kolejność w zestawie</option>
          </select>
        </label>
      </div>
      <div class="filter-actions">
        <button class="btn ghost" id="clearFilters" data-i18n="clearFilters">Wyczyść filtry</button>
        <button class="btn" id="closeFilters" data-i18n="done">Gotowe</button>
      </div>
    </div>
  </header>

  <main id="main">
    <p class="status" id="status" data-i18n="loading">Ładowanie danych…</p>
    <div id="grid"></div>
  </main>

  <!-- Szczegóły stworka -->
  <div class="detail" id="detail" hidden aria-modal="true" role="dialog" aria-labelledby="dName">
    <div class="detail-bar">
      <button class="icon-btn" id="dClose" data-i18n-aria="close">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
      </button>
      <span class="detail-pos" id="dPos"></span>
      <div class="detail-nav">
        <button class="icon-btn" id="dPrev" data-i18n-aria="prev">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m15.4 5-7 7 7 7 1.4-1.4-5.6-5.6 5.6-5.6L15.4 5Z"/></svg>
        </button>
        <button class="icon-btn" id="dNext" data-i18n-aria="next">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m8.6 5 7 7-7 7-1.4-1.4 5.6-5.6-5.6-5.6L8.6 5Z"/></svg>
        </button>
      </div>
    </div>
    <div class="detail-scroll" id="dScroll">
      <div class="detail-inner" id="dInner"></div>
    </div>
  </div>

  <!-- Zestaw: lista kart i kompletność -->
  <div class="detail" id="setView" hidden aria-modal="true" role="dialog" aria-labelledby="setTitle">
    <div class="detail-bar">
      <button class="icon-btn" id="setClose" data-i18n-aria="back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m15.4 5-7 7 7 7 1.4-1.4-5.6-5.6 5.6-5.6L15.4 5Z"/></svg>
      </button>
      <span class="detail-pos" id="setTitle"></span>
      <span class="icon-btn-spacer"></span>
    </div>
    <div class="detail-scroll" id="setScroll">
      <div class="detail-inner" id="setInner"></div>
    </div>
  </div>

  <!-- Skaner kart (kamera + OCR) -->
  <div class="scanner" id="scanner" hidden aria-modal="true" role="dialog" data-i18n-aria="scan">
    <div class="scan-stage" id="scanStage">
      <video id="scanVideo" playsinline muted autoplay></video>
      <div class="scan-frame" id="scanFrame"><span></span></div>
      <p class="scan-hint" id="scanHint" data-i18n="scanHint"></p>
    </div>
    <div class="scan-top">
      <button class="icon-btn" id="scanClose" data-i18n-aria="close">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
      </button>
    </div>
    <div class="scan-controls" id="scanControls">
      <label class="scan-side">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2ZM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5Z"/></svg>
        <span data-i18n="scanPhoto">Zdjęcie</span>
        <input type="file" id="scanFile" accept="image/*">
      </label>
      <button class="shutter" id="scanShot" data-i18n-aria="scanCapture"><span></span></button>
      <button class="scan-side" id="scanCam" type="button" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 0 1 4.6 3H19l-3 3-3-3h1.4A3 3 0 0 0 9.4 12.5l-1.6-1.2A5 5 0 0 1 12 8Zm-3 5 3 3H10.6a3 3 0 0 0 5-1.5l1.6 1.2A5 5 0 0 1 7.4 16H5l3-3Z"/></svg>
        <span data-i18n="scanCamera">Aparat</span>
      </button>
    </div>
    <div class="scan-result" id="scanResult" hidden></div>
  </div>

  <!-- Podgląd karty TCG + dodawanie do kolekcji -->
  <dialog id="cardDlg" class="sheet">
    <div class="sheet-body" id="cardDlgBody"></div>
  </dialog>

  <!-- Ustawienia -->
  <dialog id="settingsDlg" class="sheet">
    <div class="sheet-body">
      <div class="sheet-head">
        <h2><span data-i18n="settings">Ustawienia</span> <small class="ver-badge" id="setVersion"></small></h2>
        <button class="icon-btn dark" data-close data-i18n-aria="close">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
        </button>
      </div>

      <section class="set-group">
        <label class="row"><span data-i18n="language">Język</span>
          <select id="sLang">
            <option value="pl">Polski</option>
            <option value="en">English</option>
          </select>
        </label>
      </section>

      <section class="set-group">
        <h3 data-i18n="binder">Album</h3>
        <label class="row"><span data-i18n="pockets">Kieszonek na stronie</span>
          <select id="sPocket">
            <option value="4">4 (2×2)</option>
            <option value="9">9 (3×3)</option>
            <option value="12">12 (4×3)</option>
            <option value="16">16 (4×4)</option>
          </select>
        </label>
        <label class="row"><span data-i18n="offset">Pierwsza strona zaczyna się od pozycji</span>
          <input id="sOffset" type="number" min="1" max="16" value="1" inputmode="numeric">
        </label>
        <label class="row check"><input type="checkbox" id="sPages"> <span data-i18n="pagesToggle">Podział na strony albumu</span></label>
        <label class="row check"><input type="checkbox" id="sCardImg"> <span data-i18n="cardImgToggle">„Mój album”: pokazuj obrazki moich kart</span></label>
        <label class="row check"><input type="checkbox" id="sHd"> <span data-i18n="hdToggle">Duże obrazki w siatce (więcej danych)</span></label>
      </section>

      <section class="set-group">
        <h3 data-i18n="dataSec">Dane</h3>
        <p class="muted" data-i18n="dataHint"></p>
        <div class="btn-row">
          <button class="btn" id="exportBtn" data-i18n="export">Eksport CSV</button>
          <label class="btn ghost file"><span data-i18n="import">Import CSV</span><input type="file" id="importFile" accept=".csv,text/csv,text/plain"></label>
        </div>
        <label class="row check"><input type="checkbox" id="importMerge" checked> <span data-i18n="importMerge"></span></label>
        <p class="muted small" id="dataInfo"></p>
        <button class="btn danger" id="resetBtn" data-i18n="reset">Wyczyść całą kolekcję</button>
      </section>

      <section class="set-group">
        <h3 data-i18n="pwSec">Ceny kart (PokéWallet)</h3>
        <p class="muted small" id="pwHint"></p>
        <label class="row"><span data-i18n="pwKey">Klucz API</span>
          <span class="key-row">
            <input id="pwKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="pk_live_…">
            <button class="btn ghost small" id="pwShow" type="button" data-i18n-aria="pwShowKey">👁</button>
          </span>
        </label>
        <div class="btn-row">
          <button class="btn small" id="pwSave" data-i18n="pwSaveTest">Zapisz i sprawdź</button>
          <button class="btn ghost small" id="pwClear" data-i18n="pwRemove">Usuń klucz</button>
        </div>
        <label class="row"><span data-i18n="pwSource">Główne źródło cen</span>
          <select id="pwSrc">
            <option value="cm">Cardmarket (EUR)</option>
            <option value="tcg">TCGplayer (USD)</option>
          </select>
        </label>
        <div class="btn-row">
          <button class="btn small" id="pwValue" data-i18n="pwValueBtn">Wyceń kolekcję</button>
          <button class="btn ghost small" id="pwCacheClear" data-i18n="pwCacheClear">Wyczyść zapisane ceny</button>
        </div>
        <p class="muted small" id="pwStatus" role="status"></p>
      </section>

      <section class="set-group">
        <h3 data-i18n="sourcesSec">Źródła danych</h3>
        <p class="muted small" id="sourcesText"></p>
      </section>

      <section class="set-group">
        <h3 data-i18n="aboutSec">O aplikacji</h3>
        <p class="ver-line"><b id="appVersion"></b><br><span class="muted small" id="swVersion"></span></p>
        <div class="btn-row">
          <button class="btn ghost small" id="checkUpdBtn" data-i18n="checkUpdate">Sprawdź aktualizacje</button>
        </div>
        <p class="muted small" id="updStatus" role="status"></p>
      </section>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script src="sets.js"></script>
  <script src="scanner.js"></script>
  <script src="prices.js"></script>
</body>
</html>
